="12" x="0"><tspan>SYSTEM_OFF_S</tspan></text><text y="26.4" data-line-font-size="12" x="0"/><text y="40.8" data-line-font-size="12" x="0"/><text y="55.2" data-line-font-size="12" x="0"><tspan>- MCP2418 aus.</tspan></text><text y="69.6" data-line-font-size="12" x="0"><tspan>- SD Karte aus.</tspan></text><text y="84" data-line-font-size="12" x="0"><tspan>- Core 1 aus.</tspan></text><text y="98.4" x="0"><tspan>- Mikrocontroller im Dormant-</tspan></text><text y="112.8" x="0"><tspan>Modus.</tspan></text></g></g></g></g><g data-cell-id="xxhYMAWiVSyPZR9s3puQ-5"><g transform="translate(0.5,0.5)"><path d="M 684 324 L 684 174 Q 684 164 674 164 L 552.12 164" fill="none" stroke="#000000" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(0, 0, 0);"/><path d="M 545.12 164 L 552.12 161.67 L 552.12 166.33 Z" fill="#000000" stroke="#000000" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(0, 0, 0); stroke: rgb(0, 0, 0);"/></g><g data-cell-id="xxhYMAWiVSyPZR9s3puQ-8"><g><g fill="#000000" font-family="'IBM Plex Serif'" text-anchor="middle" font-size="11px" style="fill: rgb(0, 0, 0);"><rect fill="#ffffff" stroke="none" x="604" y="202" width="162" height="67" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="684.5" y="213">kein CAN-FD Interrupt request</text><text x="684.5" y="226">&amp;&amp;</text><text x="684.5" y="239"> Ringbuffer leer</text><text x="684.5" y="252">&amp;&amp;</text><text x="684.5" y="265">SD- Unmounted</text></g></g></g></g><g data-cell-id="aNN_Nz6Uun0s17gYSqiJ-5"><g transform="translate(0.5,0.5)" style="filter: drop-shadow(rgba(0, 0, 0, 0.25) 2px 3px 2px);"><rect x="564" y="324" width="240" height="240" rx="10" ry="10" fill="#f5f5f5" stroke="#000000" pointer-events="all" style="fill: rgb(245, 245, 245); stroke: rgb(0, 0, 0);"/></g><g><g fill="#000000" font-family="'IBM Plex Serif'" text-anchor="start" data-blockTextHeight="158.4" data-htmlContentWidth="209.3055877685547" font-size="12px" style="fill: rgb(0, 0, 0);"><g transform="translate(579,344) scale(1)"><text y="12" data-line-font-size="12" x="0"><tspan>SYSTEM_STOPPING_S</tspan></text><text y="26.4" data-line-font-size="12" x="0"/><text y="40.8" data-line-font-size="12" x="0"/><text y="55.2" x="0"><tspan>Core0:  Liest weiterhin Nachrichten</tspan></text><text y="69.6" x="0"><tspan>aus CAN-Controller und schreibt in</tspan></text><text y="84" x="0"><tspan>Ringbuffer.</tspan></text><text y="98.4" data-line-font-size="12" x="0"/><text y="112.8" x="0"><tspan>Core1: Schreibt weiterhin CSV-Zeilen</tspan></text><text y="127.2" x="0"><tspan>auf SD- Karte bis Ringbuffer leer ist,</tspan></text><text y="141.6" x="0"><tspan>danach SD- Karte synchronisieren,</tspan></text><text y="156" x="0"><tspan>unmounten.</tspan></text></g></g></g></g><g data-cell-id="HzolIZFbY-MjnkyyfpTD-3"><g transform="translate(0.5,0.5)"><path d="M 544 724 L 674 724 Q 684 724 684 714 L 684 572.12" fill="none" stroke="#000000" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(0, 0, 0);"/><path d="M 684 565.12 L 686.33 572.12 L 681.67 572.12 Z" fill="#000000" stroke="#000000" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(0, 0, 0); stroke: rgb(0, 0, 0);"/></g><g data-cell-id="HzolIZFbY-MjnkyyfpTD-4"><g><g fill="#000000" font-family="'IBM Plex Serif'" text-anchor="middle" font-size="11px" style="fill: rgb(0, 0, 0);"><rect fill="#ffffff" stroke="none" x="638" y="632" width="95" height="27" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="684.5" y="636">Power-Detect Low</text></g></g></g></g><g data-cell-id="oY-qiJIkAWfNNHOQdYFs-1"><g transform="translate(0.5,0.5)" style="filter: drop-shadow(rgba(0, 0, 0, 0.25) 2px 3px 2px);"><rect x="304" y="604" width="240" height="240" rx="10" ry="10" fill="#f5f5f5" stroke="#000000" pointer-events="all" style="fill: rgb(245, 245, 245); stroke: rgb(0, 0, 0);"/></g><g><g fill="#000000" font-family="'IBM Plex Serif'" text-anchor="start" data-blockTextHeight="172.8" data-htmlContentWidth="207.02554321289062" font-size="12px" style="fill: rgb(0, 0, 0);"><g transform="translate(319,624) scale(1)"><text y="12" data-line-font-size="12" x="0"><tspan>SYSTEM_RUNNING_S</tspan></text><text y="26.4" data-line-font-size="12" x="0"/><text y="40.8" data-line-font-size="12" x="0"/><text y="55.2" x="0"><tspan>- Core0: Überwacht CAN- Interrupt</tspan></text><text y="69.6" x="0"><tspan>request und Power-Detect, liest nach</tspan></text><text y="84" x="0"><tspan>Bedarf Daten aus CAN- Controller</tspan></text><text y="98.4" x="0"><tspan>und speichert in Ringbuffer.</tspan></text><text y="112.8" data-line-font-size="12" x="0"/><text y="127.2" x="0"><tspan>- Core1: prüft Ringbuffer auf</tspan></text><text y="141.6" x="0"><tspan>vorhandene Einträge, konvertiert in</tspan></text><text y="156" x="0"><tspan>CSV- Zeile, formatiert in FAT-32-</tspan></text><text y="170.4" x="0"><tspan>Format, schreibt auf SD- Karte.</tspan></text></g></g></g></g></g></g></g></svg>